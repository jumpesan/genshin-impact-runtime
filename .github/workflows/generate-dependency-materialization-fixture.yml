name: Generate dependency materialization fixtures

on:
  push:
    branches:
      - agent/dependency-materialization-fixture
    paths:
      - .github/workflows/generate-dependency-materialization-fixture.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate exact fixed-revision fixtures
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          REPO = "jumpesan/genshin-impact-runtime"
          AUTH_REV = "4fc650013b680963e1a72c491ed3ae5c5639c3c7"
          OUT = Path("experiments/materialization/dependency")
          OUT.mkdir(parents=True, exist_ok=True)
          CHUNK = 4096

          ENTRY = "tools/identity/targeted_identity_readiness.py"
          DEP = "tools/identity/identity_integration_validator.py"

          def git_show(path: str) -> bytes:
              return subprocess.check_output(["git", "show", f"{AUTH_REV}:{path}"])

          def git_blob_sha(data: bytes) -> str:
              h = hashlib.sha1()
              h.update(f"blob {len(data)}\0".encode("ascii"))
              h.update(data)
              return h.hexdigest()

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def materialize_rep(name: str, source: bytes) -> dict:
              gz = gzip.compress(source, compresslevel=9, mtime=0)
              b64 = base64.b64encode(gz).decode("ascii")
              chunks = []
              for i in range(0, len(b64), CHUNK):
                  text = b64[i:i+CHUNK]
                  part = len(chunks) + 1
                  path = OUT / f"{name}.gzip-base64.part-{part:03d}.b64"
                  path.write_text(text, encoding="ascii", newline="")
                  raw = text.encode("ascii")
                  chunks.append({
                      "path": str(path.relative_to(OUT)),
                      "encoded_length_chars": len(text),
                      "ascii_sha256": sha256(raw),
                      "git_blob_sha": git_blob_sha(raw),
                  })
              return {
                  "identity": {
                      "size_bytes": len(source),
                      "sha256": sha256(source),
                      "git_blob_sha": git_blob_sha(source),
                  },
                  "representation": {
                      "role": "TRANSPORT_ONLY",
                      "profile": "gzip-base64-chunked-v1",
                      "compression": {
                          "algorithm": "gzip",
                          "profile": "deterministic-gzip-v1",
                          "compresslevel": 9,
                          "mtime": 0,
                      },
                      "encoding": {
                          "algorithm": "base64",
                          "variant": "RFC4648_STANDARD",
                          "padding": "required",
                      },
                      "compressed_identity": {
                          "size_bytes": len(gz),
                          "sha256": sha256(gz),
                      },
                      "encoded_length_chars": len(b64),
                      "chunks": chunks,
                  },
              }

          entry_bytes = git_show(ENTRY)
          dep_bytes = git_show(DEP)
          entry = materialize_rep("targeted_identity_readiness_4fc65001", entry_bytes)
          dep = materialize_rep("identity_integration_validator_4fc65001", dep_bytes)

          base = {
              "descriptor_version": "0.1-experiment",
              "descriptor_role": "EXECUTABLE_EXECUTION_UNIT_DESCRIPTOR",
              "experiment_role": "DEPENDENCY_AUTHORITY_VALIDATION",
              "authority": {
                  "repository": REPO,
                  "revision": AUTH_REV,
              },
              "entrypoint": {
                  "path": ENTRY,
                  "required_manifest_role": "TRUSTED_EXECUTABLE",
                  "identity": entry["identity"],
                  "representation": entry["representation"],
                  "declared_import_requirements": [
                      {
                          "module": "identity_integration_validator",
                          "required_relative_path": DEP,
                          "kind": "EXECUTABLE_CODE_DEPENDENCY",
                      }
                  ],
              },
              "executable_dependencies": [
                  {
                      "path": DEP,
                      "required_manifest_role": "TRUSTED_EXECUTABLE",
                      "identity": dep["identity"],
                      "representation": dep["representation"],
                      "materialization_relation": "same_parent_directory_as_entrypoint",
                  }
              ],
              "materialization_policy": {
                  "all_executable_members_must_be_registered": True,
                  "all_executable_members_must_match_identity": True,
                  "undeclared_executable_dependency": "deny",
                  "recursive_import_discovery": "forbidden",
                  "network_dependency_fetch": "forbidden",
                  "semantic_dependency_reimplementation": "forbidden",
                  "unit_eligible_only_after_all_members_verified": True,
              },
          }

          d2 = dict(base)
          d2["control"] = "D2_DECLARED_EXECUTABLE_DEPENDENCY_POSITIVE"
          (OUT / "identity_targeted_readiness_4fc65001.execution-unit.descriptor.json").write_text(
              json.dumps(d2, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )

          d3 = json.loads(json.dumps(base))
          d3["control"] = "D3_UNDECLARED_EXECUTABLE_DEPENDENCY"
          d3["executable_dependencies"] = []
          d3["expected_contract_behavior"] = {
              "execution_unit_eligible": False,
              "required_failure": "EXECUTABLE_DEPENDENCY_UNDECLARED",
          }
          (OUT / "identity_targeted_readiness_4fc65001.undeclared-dependency.descriptor.json").write_text(
              json.dumps(d3, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )

          d4 = json.loads(json.dumps(base))
          d4["control"] = "D4_DEPENDENCY_IDENTITY_MISMATCH"
          good = d4["executable_dependencies"][0]["identity"]["sha256"]
          d4["executable_dependencies"][0]["identity"]["sha256"] = good[:-1] + ("0" if good[-1] != "0" else "1")
          d4["expected_contract_behavior"] = {
              "execution_unit_eligible": False,
              "required_failure": "EXECUTION_UNIT_DEPENDENCY_IDENTITY_MISMATCH",
          }
          (OUT / "identity_targeted_readiness_4fc65001.dependency-sha-mismatch.descriptor.json").write_text(
              json.dumps(d4, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )

          report = {
              "authority_revision": AUTH_REV,
              "entrypoint": {"path": ENTRY, **entry["identity"], "chunks": len(entry["representation"]["chunks"])},
              "dependency": {"path": DEP, **dep["identity"], "chunks": len(dep["representation"]["chunks"])},
              "d2_descriptor": "identity_targeted_readiness_4fc65001.execution-unit.descriptor.json",
              "d3_descriptor": "identity_targeted_readiness_4fc65001.undeclared-dependency.descriptor.json",
              "d4_descriptor": "identity_targeted_readiness_4fc65001.dependency-sha-mismatch.descriptor.json",
          }
          (OUT / "identity_targeted_readiness_4fc65001.fixture-report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Commit generated fixtures
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/materialization/dependency
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "experiment: publish dependency materialization fixtures"
          git push origin HEAD:agent/dependency-materialization-fixture
